name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(node -p "require('./plugins/collaborative-blog/plugin.info').version")
          echo "Tag: $TAG_VERSION  plugin.info: $PLUGIN_VERSION"
          test "$TAG_VERSION" = "$PLUGIN_VERSION"

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Lint and test
        run: |
          npm run lint
          npm run test:functions
          npm run build
          npm run test:e2e

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum collaborative-blog-plugin.json collaborative-blog-plugin.tid collaborative-blog-starter.json index.html tiddlysite-starter.zip > checksums.txt
          cd ..
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0 ~ "^## " { if (found) exit; if (index($0, v) == 1) found=1 } found' CHANGELOG.md > dist/release-notes.md
          {
            echo ""
            echo "### Downloads"
            echo ""
            echo "- **tiddlysite-starter.zip**: a complete site (index.html plus Cloudflare functions) to upload to a new GitHub repository. Start here for a new site."
            echo "- **collaborative-blog-plugin.json** or **.tid**: the plugin on its own, to drag onto an existing TiddlyWiki."
            echo "- **collaborative-blog-starter.json**: the plugin plus example content."
            echo "- **checksums.txt**: SHA-256 checksums."
          } >> dist/release-notes.md
          cat dist/release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: TiddlySite ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/tiddlysite-starter.zip
            dist/collaborative-blog-plugin.json
            dist/collaborative-blog-plugin.tid
            dist/collaborative-blog-starter.json
            dist/index.html
            dist/checksums.txt
