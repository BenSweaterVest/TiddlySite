name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test Cloudflare functions
        run: npm run test:functions

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: tiddlysite-build
          path: dist/
          retention-days: 14
